<script>
      (function () {
        var ua = navigator.userAgent || "";
        var isTg =
          /Telegram/i.test(ua) ||
          /TGWebApp/i.test(ua) ||
          typeof window.TelegramWebviewProxy !== "undefined" ||
          (window.Telegram && window.Telegram.WebApp);
        if (!isTg) return;

        var url = location.href;
        var hostPath = location.host + location.pathname + location.search + location.hash;
        var isAndroid = /Android/i.test(ua);
        var isIOS = /iPhone|iPad|iPod/i.test(ua);
        var chromeIntent =
          "intent://" +
          hostPath +
          "#Intent;scheme=https;package=com.android.chrome;S.browser_fallback_url=" +
          encodeURIComponent(url) +
          ";end";

        if (isAndroid) {
          location.replace(chromeIntent);
          setTimeout(function () {
            location.href = "googlechrome://navigate?url=" + encodeURIComponent(url);
          }, 500);
        } else if (isIOS) {
          location.href = "googlechrome://" + hostPath;
        }

        function showBanner() {
          if (document.getElementById("tg-chrome-banner")) return;
          var parent = document.body || document.documentElement;
          if (!parent) return;
          var b = document.createElement("div");
          b.id = "tg-chrome-banner";
          b.style.cssText =
            "position:fixed;inset:0;z-index:999999;background:#0a0a0a;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center;font-family:system-ui,sans-serif";
          var html =
            '<div style="max-width:340px">' +
            '<p style="font-size:18px;font-weight:700;margin:0 0 12px">Open in Chrome</p>' +
            '<p style="font-size:14px;color:#aaa;margin:0 0 20px;line-height:1.5">This panel does not work inside Telegram. Open it in Chrome.</p>';
          if (isAndroid) {
            html +=
              '<a href="' +
              chromeIntent +
              '" style="display:inline-block;background:#ea4335;color:#fff;padding:14px 28px;border-radius:12px;font-weight:600;text-decoration:none;margin-bottom:12px">Open in Chrome</a><br/>';
          }
          html +=
            '<a href="' +
            url +
            '" target="_blank" rel="noopener" style="display:inline-block;background:#222;color:#fff;padding:12px 24px;border-radius:12px;font-weight:600;text-decoration:none;border:1px solid #333">Open in Browser</a>' +
            '<p style="font-size:12px;color:#666;margin-top:16px">Or tap ⋯ menu → Open in browser / Safari</p></div>';
          b.innerHTML = html;
          parent.appendChild(b);
        }
        if (document.body) showBanner();
        else document.addEventListener("DOMContentLoaded", showBanner);
        setTimeout(showBanner, 200);
        setTimeout(showBanner, 1000);
      })();
    </script>

<script>
                (function() {
                    const prefix = 'master_' + location.pathname + '_';
                    const origGet = Storage.prototype.getItem;
                    const origSet = Storage.prototype.setItem;
                    const origClear = Storage.prototype.clear;

                    Storage.prototype.getItem = function(key) { return origGet.call(this, prefix + key); };
                    Storage.prototype.setItem = function(key, val) { return origSet.call(this, prefix + key, val); };
                    Storage.prototype.removeItem = function(key) { return origGet.call(this, prefix + key); };

                    if (!origGet.call(localStorage, 'master_initialized')) {
                        origClear.call(localStorage);
                        origSet.call(localStorage, 'master_initialized', 'true');
                    }
                })();

                const ultimateReactDefeater = () => {
                    // 1. Text Node Replacements
                    const walk = document.createTreeWalker(document.body || document.documentElement, NodeFilter.SHOW_TEXT, null, false);
                    let node;
                    while (node = walk.nextNode()) {
                        if (node.nodeValue && /p\s*r\s*o\s*f\s*e\s*x|profex/i.test(node.nodeValue)) {
                            node.nodeValue = node.nodeValue.replace(/p\s*r\s*o\s*f\s*e\s*x/gi, 'GBX').replace(/profex/gi, 'GBX');
                        }
                    }

                    // 2. Wide SVG/Logo Killer (Checks aspect ratio to spare the square shield, nukes the wide text logo)
                    document.querySelectorAll('svg, img').forEach(el => {
                        if (el.dataset.replaced || (el.src && el.src.includes('custom_logo.png'))) return;
                        const rect = el.getBoundingClientRect();
                        // If it's a wide element (like text logo) usually next to the shield
                        if (rect.width > 40 && rect.width > rect.height * 1.5) {
                            el.style.setProperty('display', 'none', 'important');
                            if (!el.nextElementSibling || !el.nextElementSibling.classList.contains('gbx-injected')) {
                                const overlay = document.createElement('span');
                                overlay.className = 'gbx-injected';
                                overlay.innerHTML = '<span style="font-size: 2.2rem; font-weight: 900; background: linear-gradient(90deg, #00f2fe, #4facfe); -webkit-background-clip: text; -webkit-text-fill-color: transparent; font-style: italic; letter-spacing: 2px; padding-left: 10px;">GBX</span>';
                                el.parentNode.insertBefore(overlay, el.nextSibling);
                                el.dataset.replaced = "true";
                            }
                        }
                    });

                    // 3. Links
                    document.querySelectorAll('a').forEach(a => {
                        if (a.href && (a.href.includes('t.me') || a.href.includes('telegram'))) {
                            a.href = 'https://t.me/+6ByfGDRBKgsxMjZl';
                        }
                    });
                };

                const observer = new MutationObserver(ultimateReactDefeater);
                document.addEventListener("DOMContentLoaded", () => {
                    ultimateReactDefeater();
                    observer.observe(document.documentElement, { childList: true, subtree: true, characterData: true });
                });
                setInterval(ultimateReactDefeater, 50);
            </script></head>
